<style>
  /* ═══════════════════════════════════════════════════
     COBRO FLOW PRO — Design System v2
   ═══════════════════════════════════════════════════ */

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideRight {
    from { opacity: 0; transform: translateX(-20px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes modalPop {
    0%   { opacity: 0; transform: scale(0.85); }
    70%  { transform: scale(1.02); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ═══════════ COFERSA BRANDING & THEMES ═══════════ */
  :root {
    /* Tema Oscuro (Defecto) */
    --bg-main: #0d1117;
    --surface-1: #161b22;
    --surface-2: #21262d;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    
    --accent: #00AEEF; /* Azul Cofersa Oscuro/Brillante */
    --accent-hover: #0095CC;
    --red: #ff7b72;
    --green: #3fb950;
    --yellow: #d29922;

    --sidebar-w: 260px;
    --shadow-sm: 0 4px 12px rgba(0,0,0,0.15);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.3);
  }

  [data-theme="light"] {
    --bg-main: #f6f8fa;
    --surface-1: #ffffff;
    --surface-2: #f3f4f6;
    --border: #d0d7de;
    --text: #24292f;
    --muted: #57606a;
    
    --accent: #00AEEF; /* Azul Cofersa */
    --accent-hover: #008CBE;
    --red: #cf222e;
    --green: #1a7f37;
    --yellow: #9a6700;
    
    --shadow-sm: 0 4px 12px rgba(0,0,0,0.05);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.1);
  }

  /* Old variables that are still used but not in the new theme structure */
  :root {
    --accent-glow: rgba(88, 166, 255, 0.25);
    --accent-dim:  rgba(88, 166, 255, 0.1);
    --green-dim:   rgba(63, 185, 80, 0.12);
    --yellow-dim:  rgba(227, 179, 65, 0.12);
    --red-dim:     rgba(255, 123, 114, 0.12);
    --glass:       blur(18px) saturate(160%);
    --radius:      16px;
    --radius-lg:   24px;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    background-color: var(--bg-main);
    color: var(--text);
    display: flex; height: 100vh;
    overflow: hidden;
    transition: background-color 0.3s, color 0.3s;
  }

  h1,h2,h3,h4 { margin: 0; line-height: 1.3; }
  a { text-decoration: none; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #484f58; }

  /* ── SIDEBAR ── */
  .sidebar {
    width: var(--sidebar-w); background-color: var(--surface-1);
    border-right: 1px solid var(--border); padding: 24px 16px;
    display: flex; flex-direction: column; gap: 8px; z-index: 10;
    transition: background-color 0.3s, border-color 0.3s;
  }
  .sidebar-logo {
    display: flex; align-items: center; justify-content: center; margin-bottom: 32px;
  }
  .sidebar-logo img {
    max-width: 160px; height: auto; object-fit: contain;
  }
  .sidebar-logo-text {
    font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em;
    color: var(--text); padding: 0 12px;
  }
  
  .nav-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    border-radius: 8px; cursor: pointer; color: var(--muted);
    font-weight: 500; font-size: .95rem; transition: all .2s;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active { background: rgba(0, 174, 239, 0.1); color: var(--accent); font-weight: 600; }
  
  .theme-toggle-btn {
    margin-top: auto; padding: 12px 16px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; gap: 12px; font-weight: 500; font-size: .95rem;
    color: var(--muted); background: transparent; border: 1px solid var(--border); transition: all 0.2s;
  }
  .theme-toggle-btn:hover { background: var(--surface-2); color: var(--text); }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-item:hover { color: var(--text); background: var(--surface-2); transform: translateX(4px); }
  .nav-item.active { color: var(--accent); background: rgba(0, 174, 239, 0.1); box-shadow: inset 0 0 0 1px rgba(0, 174, 239, 0.2); }

  /* ── MAIN ── */
  .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 36px 40px; }
  section { animation: fadeInUp .45s ease both; }
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
  .page-header h1 { font-size: 1.7rem; font-weight: 700; }

  /* ── TOOLBAR (filtros + búsqueda) ── */
  .toolbar {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 24px; flex-wrap: wrap;
  }
  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 0 14px; flex: 1; min-width: 200px; max-width: 350px;
    transition: border-color .2s, box-shadow .2s;
  }
  .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .search-box svg { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; }
  .search-box input {
    flex: 1; background: none; border: none; color: var(--text);
    padding: 10px 0; font-family: inherit; font-size: .88rem; outline: none;
  }
  .search-box input::placeholder { color: var(--muted); }

  .filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-pill {
    padding: 7px 16px; border-radius: 50px; font-size: .75rem; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface);
    color: var(--muted); transition: all .2s; user-select: none;
    letter-spacing: .03em;
  }
  .filter-pill:hover { border-color: var(--accent); color: var(--text); }
  .filter-pill.active { background: var(--accent-dim); color: var(--accent); border-color: rgba(88,166,255,.3); }

  /* ── DASHBOARD ── */
  .dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-bottom: 28px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 28px;
    transition: transform .35s cubic-bezier(.175,.885,.32,1.275), border-color .3s, box-shadow .3s;
    backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
  }
  .stat-card:hover {
    transform: translateY(-6px) scale(1.015); border-color: var(--accent);
    box-shadow: 0 16px 48px rgba(0,0,0,.45), 0 0 20px var(--accent-glow);
  }
  .stat-card .label { font-size: .72rem; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; margin-bottom: 14px; }
  .stat-card .value { font-size: 2.8rem; font-weight: 800; line-height: 1; }

  /* ── KANBAN ── */
  .kanban-container { display: flex; gap: 18px; overflow-x: auto; padding-bottom: 16px; }
  .kanban-column {
    min-width: 300px; flex: 1;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .kanban-column-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .kanban-column-header span { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .badge {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 20px;
    padding: 2px 10px; font-size: .72rem; font-weight: 700; color: var(--muted);
    min-width: 24px; text-align: center;
  }
  .kanban-card {
    background: var(--surface-2); border: 1px solid var(--border);
    border-left: 3px solid var(--accent); border-radius: var(--radius);
    padding: 16px; cursor: pointer;
    transition: transform .2s, box-shadow .2s, border-color .2s;
    animation: fadeInUp .4s ease both;
  }
  .kanban-card:hover {
    transform: translateY(-3px) translateX(3px);
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    border-color: var(--accent); border-left-color: var(--accent);
  }
  .kanban-card .k-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .kanban-card .k-name { font-weight: 600; font-size: .9rem; }
  .kanban-card .k-code { font-size: .7rem; color: var(--accent); font-weight: 700; opacity: .8; }
  .kanban-card .k-amount { font-size: 1.05rem; font-weight: 700; color: var(--accent); margin: 8px 0; }
  .kanban-card .k-date { font-size: .72rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .kanban-card .k-date svg { width: 13px; height: 13px; }
  .kanban-card .k-notes { font-size: .78rem; color: var(--muted); margin-top: 8px; font-style: italic; }
  .kanban-empty { text-align: center; padding: 28px 0; color: var(--muted); font-size: .82rem; }

  /* ── TABLAS ── */
  .table-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--muted); font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
  td { padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: .88rem; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr { transition: background .15s; }
  tr:hover td { background: var(--surface-2); }

  /* ── STATUS PILLS ── */
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px; border-radius: 50px; font-size: .72rem; font-weight: 700;
    letter-spacing: .04em; white-space: nowrap;
  }
  .status-pill svg { width: 13px; height: 13px; }
  .status-pill.clickable { cursor: pointer; transition: transform .15s, box-shadow .15s; }
  .status-pill.clickable:hover { transform: scale(1.08); box-shadow: 0 3px 12px rgba(0,0,0,.3); }
  .status-pendiente { background: var(--yellow-dim); color: var(--yellow); border: 1px solid rgba(227,179,65,.3); }
  .status-resuelto  { background: var(--green-dim);  color: var(--green);  border: 1px solid rgba(63,185,80,.3); }
  .status-parcial   { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(88,166,255,.3); }
  .status-cumplio   { background: var(--green-dim);  color: var(--green);  border: 1px solid rgba(63,185,80,.3); }

  /* ── BOTONES ── */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 20px; border-radius: 10px; font-family: inherit;
    font-size: .85rem; font-weight: 600; cursor: pointer; border: none;
    transition: transform .15s, box-shadow .15s, opacity .15s;
    white-space: nowrap;
  }
  .btn svg { width: 16px; height: 16px; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }

  .btn-accent { background: linear-gradient(135deg, var(--accent), #2f81f7); color: #fff; box-shadow: 0 4px 14px rgba(88,166,255,.35); }
  .btn-accent:hover:not(:disabled) { box-shadow: 0 6px 20px rgba(88,166,255,.55); transform: translateY(-1px); }

  .btn-green { background: linear-gradient(135deg, var(--green), #2ea043); color: #fff; box-shadow: 0 4px 14px rgba(63,185,80,.35); }
  .btn-green:hover:not(:disabled) { box-shadow: 0 6px 20px rgba(63,185,80,.55); transform: translateY(-1px); }

  .btn-danger { background: linear-gradient(135deg, var(--red), #da3633); color: #fff; box-shadow: 0 4px 14px rgba(255,123,114,.3); }
  .btn-danger:hover:not(:disabled) { box-shadow: 0 6px 20px rgba(255,123,114,.5); transform: translateY(-1px); }

  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }

  .btn-sm { padding: 6px 12px; font-size: .75rem; border-radius: 8px; }
  .btn-sm svg { width: 13px; height: 13px; }
  .btn-full { width: 100%; justify-content: center; }

  .btn-icon {
    padding: 6px; border-radius: 8px; background: none; border: 1px solid transparent;
    color: var(--muted); cursor: pointer; display: inline-flex; align-items: center;
    transition: all .15s;
  }
  .btn-icon svg { width: 15px; height: 15px; }
  .btn-icon:hover { background: var(--red-dim); color: var(--red); border-color: rgba(255,123,114,.3); }

  .actions-cell { display: flex; align-items: center; gap: 8px; }

  /* ── MODALES ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: none; justify-content: center; align-items: center; z-index: 2000;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: var(--radius-lg); width: 100%; max-width: 520px;
    padding: 36px; animation: modalPop .38s cubic-bezier(.34,1.56,.64,1) both;
    box-shadow: 0 40px 80px rgba(0,0,0,.8); max-height: 90vh; overflow-y: auto;
  }
  .modal-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 28px; }

  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .detail-item label { display: block; font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; margin-bottom: 4px; }
  .detail-item .val { font-size: 1rem; font-weight: 600; color: var(--text); }
  .detail-item.full { grid-column: 1 / -1; }

  /* ── FLOATING CHAT (ASISTENTE NLP V3) ── */
  .floating-btn {
    position: fixed; bottom: 24px; right: 24px; z-index: 1000;
    width: 60px; height: 60px; border-radius: 30px;
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    box-shadow: 0 4px 16px rgba(0, 174, 239, 0.4);
    display: flex; align-items: center; justify-content: center;
    color: white; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: none; outline: none;
  }
  .floating-btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(0, 174, 239, 0.5); }
  .floating-btn i { width: 26px; height: 26px; }

  .floating-chat {
    position: fixed; bottom: 96px; right: 24px; z-index: 999;
    width: 400px; max-height: calc(100vh - 120px);
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: var(--shadow-md);
    display: flex; flex-direction: column; opacity: 0; pointer-events: none;
    transform: translateY(20px); transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); overflow: hidden;
  }
  .floating-chat.open { opacity: 1; pointer-events: auto; transform: translate(0, 0); }
  .floating-chat.expanded {
    width: 800px; max-width: 90vw; height: 80vh;
    bottom: 50vh; right: 50vw; transform: translate(50%, 50%);
  }
  
  .chat-header {
    background: var(--surface-2); padding: 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .chat-header h3 { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--text); }
  .chat-header button { background: none; border: none; color: var(--muted); cursor: pointer; }
  .chat-header button:hover { color: var(--text); }

  .chat-body {
    padding: 16px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
  }

  .magic-textarea {
    width: 100%; min-height: 100px; max-height: 200px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 12px; padding: 12px;
    color: var(--text); font-family: monospace; font-size: .85rem; line-height: 1.4;
    resize: vertical; outline: none; transition: border-color .2s;
  }
  .magic-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 174, 239, 0.2); }
  
  .magic-cards-container {
    display: flex; flex-direction: column; gap: 8px; margin-top: 4px;
  }
  
  .m-card {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; display: flex; align-items: center; gap: 12px;
    transition: background .2s, border-color .2s;
  }
  .m-card.error {
    background: rgba(255, 123, 114, 0.04); border-color: rgba(255, 123, 114, 0.2);
  }
  .m-card.success { border-left: 3px solid var(--accent); }
  
  .m-card-icon {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0;
  }
  .m-card.promesa .m-card-icon { background: rgba(88, 166, 255, 0.1); color: var(--accent); }
  .m-card.incidencia .m-card-icon { background: rgba(255, 123, 114, 0.1); color: var(--red); }
  .m-card.cliente .m-card-icon { background: rgba(63, 185, 80, 0.1); color: var(--green); }
  .m-card.error .m-card-icon { background: transparent; color: var(--red); }
  
  .m-card-body { flex: 1; min-width: 0; }
  .m-card-title { font-size: .85rem; font-weight: 600; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
  .m-card-desc { font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
  .m-card-desc strong { color: var(--text); font-weight: 500;}
  .m-card.error .m-card-desc { color: var(--red); font-style: italic; }

  /* ── FORMULARIOS ── */
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; color: var(--muted); font-size: .78rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 8px; }
  
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 12px 14px; background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 8px; color: var(--text);
    font-family: inherit; font-size: .95rem; outline: none; transition: border-color .2s;
  }
  /* Ajuste contraste inputs en modo claro */
  [data-theme="light"] .form-group input, 
  [data-theme="light"] .form-group select, 
  [data-theme="light"] .form-group textarea {
    background: #ffffff; border: 1px solid #d0d7de; box-shadow: inset 0 1px 2px rgba(0,0,0,0.03);
  }
  
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 174, 239, 0.15);
  }
  .form-group textarea { min-height: 80px; resize: vertical; }
  .form-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .form-actions-row { display: flex; gap: 10px; margin-top: 8px; }
  .form-actions-row > * { flex: 1; }

  /* ── DIVIDER ── */
  .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

  /* ── TOAST NOTIFICATION ── */
  .toast {
    position: fixed; bottom: 30px; right: 30px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 22px;
    color: var(--text); font-size: .88rem; font-weight: 500;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
    z-index: 5000; display: flex; align-items: center; gap: 10px;
    animation: fadeInUp .3s ease both;
    transition: opacity .3s;
  }
  .toast svg { width: 18px; height: 18px; }
  .toast.success { border-color: rgba(63,185,80,.4); }
  .toast.success svg { color: var(--green); }
  .toast.error { border-color: rgba(255,123,114,.4); }
  .toast.error svg { color: var(--red); }
/* ═══════ COMPONENTE: SEARCH SELECT PRO ═══════ */
.search-select-container { position: relative; width: 100%; }
.search-select-input {
  width: 100%; padding: 12px 16px; border-radius: 8px;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text); font-size: 0.95rem; transition: all 0.2s;
}
.search-select-input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.15); }
.search-results {
  position: absolute; top: 100%; left: 0; right: 0;
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; margin-top: 4px; max-height: 250px;
  overflow-y: auto; z-index: 1000; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  display: none;
}
.search-results.open { display: block; }
.search-item {
  padding: 10px 16px; cursor: pointer; border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 2px;
}
.search-item:last-child { border-bottom: none; }
.search-item:hover { background: var(--surface-3); }
.search-item .s-name { font-weight: 600; font-size: 0.9rem; }
.search-item .s-code { font-size: 0.75rem; color: var(--accent); opacity: 0.8; }

/* ═══════ MÓDULO LLAMADAS ═══════ */
.call-log-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 20px; }
.call-card {
